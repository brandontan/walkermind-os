# fly.toml app configuration file generated for crusaderbot on 2026-06-10T12:56:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crusaderbot'
primary_region = 'sin'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Run DB migrations in a one-off release machine BEFORE promoting the new
  # version (WARP-80 RCA). A migration failure now fails the DEPLOY and Fly keeps
  # the previous version serving, instead of crash-looping the web app at boot
  # (run_migrations is also awaited in the lifespan, but the tracker makes that a
  # fast skip-all once this step has applied everything). See scripts/migrate.py.
  release_command = 'python -m crusaderbot.scripts.migrate'
  strategy = 'immediate'

[env]
  APP_ENV = 'production'
  AUTO_REDEEM_ENABLED = 'true'
  CAPITAL_MODE_CONFIRMED = 'false'
  DB_POOL_MAX = '10'
  ENABLE_LIVE_TRADING = 'false'
  EXECUTION_PATH_VALIDATED = 'false'
  FEE_COLLECTION_ENABLED = 'false'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  RISK_CONTROLS_VALIDATED = 'false'
  SECURITY_HARDENING_VALIDATED = 'false'
  TELEGRAM_BOT_USERNAME = 'CrusaderPolybot'
  PLAYBOOK_STRATEGY_ENABLED = 'true'
  TIMEZONE = 'Asia/Jakarta'
  WEATHER_STRATEGY_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '1m0s', interval = '15s', method = 'GET', path = '/health', protocol = 'http', timeout = '10s' }]
  concurrency = { hard_limit = 100, soft_limit = 50, type = 'requests' }

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024

[[vm]]
  size = 'shared-cpu-4x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 2048
  processes = ['app']

[[metrics]]
  port = 8080
  path = '/metrics'
